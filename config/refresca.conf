# =============================================================================
# config/refresca.conf — configuração central da infraestrutura Refresca SP
# Todos os scripts leem este arquivo. Para reproduzir o ambiente em outra VM,
# ajuste apenas os valores abaixo (principalmente o bloco de REDE).
# =============================================================================

# --- Identidade do servidor ---------------------------------------------------
NEW_HOSTNAME="refresca-srv01"
DOMAIN="refresca.local"
TIMEZONE="America/Sao_Paulo"
ADMIN_USER="azureuser"                      # usuário humano que administra a VM

# --- Rede (valores obtidos na VM do Azure com: ip -br a / ip route) ----------
NET_IFACE="eth0"
STATIC_IP="172.16.0.4"                      # mesmo IP fixado como "Estático" no portal
NET_PREFIX="24"
GATEWAY="172.16.0.1"
DNS_SERVERS="168.63.129.16 1.1.1.1"         # DNS do Azure + Cloudflare como reserva
EXTRA_HOST_ALIASES="api.refresca.local monitor.refresca.local"

# --- Aplicação (API C# da disciplina de C# Software Development) --------------
# Atenção: systemd/refresca-api.service usa caminhos fixos (/opt/refresca,
# /var/lib/refresca, /opt/dotnet e o nome da DLL). Se mudar aqui, ajuste a unit.
APP_USER="refresca"
APP_DIR="/opt/refresca"
DATA_DIR="/var/lib/refresca"
APP_REPO_URL="https://github.com/NicolasABorges/RefrescaSP.git"
APP_REPO_REF="main"                         # branch ou tag implantada
APP_PROJECT="src/RefrescaSP.Api/RefrescaSP.Api.csproj"
APP_DLL="RefrescaSP.Api.dll"
RUN_APP_TESTS="1"                           # 1 = roda "dotnet test" antes de publicar
DOTNET_CHANNEL="10.0"
DOTNET_DIR="/opt/dotnet"
API_PORT="5000"                             # porta interna (Kestrel); o nginx expõe na 80
HEALTH_PATH="/api/refugios"                 # rota usada para verificar se a API responde

# --- Monitoramento ------------------------------------------------------------
MONITOR_USER="refresca-mon"
MONITOR_INTERVAL="15"                       # segundos entre verificações
CPU_WARN="80";  CPU_CRIT="95"               # limites em %
MEM_WARN="80";  MEM_CRIT="95"
DISK_WARN="85"; DISK_CRIT="95"

# --- Sistema ------------------------------------------------------------------
SWAP_SIZE="2G"                              # evita o OOM killer nos testes de estresse
