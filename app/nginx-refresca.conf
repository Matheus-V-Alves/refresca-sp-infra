# =============================================================================
# nginx — proxy reverso da API Refresca SP
# Porta 80 (pública) -> uvicorn em 127.0.0.1:__API_PORT__ (só local)
# Os marcadores __X__ são preenchidos por app/deploy-app.sh.
# =============================================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __SERVER_NAMES__;

    access_log /var/log/nginx/refresca_access.log;
    error_log  /var/log/nginx/refresca_error.log;

    location / {
        proxy_pass http://127.0.0.1:__API_PORT__;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
